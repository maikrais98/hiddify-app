name: iOS baseline TestFlight

on:
  workflow_dispatch:
    inputs:
      sourceSHA:
        description: Exact reviewed source commit
        required: true
        type: string
      version:
        description: Fixed marketing version
        required: true
        type: string
      buildNumber:
        description: Fixed positive App Store build number
        required: true
        type: string
      metadataPublicKey:
        description: Base64-encoded RSA public key for encrypted metadata
        required: false
        type: string
      operation:
        description: Upload once, resume status, or read encrypted metadata
        required: true
        type: choice
        options:
          - upload
          - status
          - metadata

permissions: {}

concurrency:
  group: ios-baseline-${{ inputs.sourceSHA }}-${{ inputs.operation }}
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: macos-26-intel
    permissions:
      contents: read
    steps:
      - name: Validate exact reviewed source and release identity
        env:
          SOURCE_SHA: ${{ inputs.sourceSHA }}
          OPERATION: ${{ inputs.operation }}
          TRUSTED_SOURCE_SHA: 3fb04c73f94c1174a668842ec3e50190abef6e6a
          TRUSTED_RELEASE_SOURCE_SHA: 2c45e4e73fae9de250787c544dae634d92b9985f
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR_CODE=INVALID_SOURCE_SHA"; exit 1; }
          [[ "$TRUSTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR_CODE=INVALID_TRUSTED_SOURCE_SHA"; exit 1; }
          [[ "$TRUSTED_RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ERROR_CODE=INVALID_TRUSTED_RELEASE_SOURCE_SHA"; exit 1; }
          case "$OPERATION" in
            metadata) expected_source_sha="$TRUSTED_SOURCE_SHA" ;;
            upload|status) expected_source_sha="$TRUSTED_RELEASE_SOURCE_SHA" ;;
            *) echo "ERROR_CODE=INVALID_OPERATION"; exit 1 ;;
          esac
          [[ "$SOURCE_SHA" == "$expected_source_sha" ]] || { echo "ERROR_CODE=UNREVIEWED_SOURCE_SHA"; exit 1; }
      - name: Validate fixed version and build number
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.buildNumber }}
          OPERATION: ${{ inputs.operation }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "ERROR_CODE=INVALID_VERSION"; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "ERROR_CODE=INVALID_BUILD_NUMBER"; exit 1; }
          if [[ "$OPERATION" == "upload" || "$OPERATION" == "status" ]]; then
            test "$VERSION" = "0.1.0" || { echo "ERROR_CODE=UNAPPROVED_VERSION"; exit 1; }
            test "$BUILD_NUMBER" -ge 28 || { echo "ERROR_CODE=BUILD_BELOW_APPROVED_MINIMUM"; exit 1; }
          fi
      - name: Verify available Intel Apple toolchain
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
        run: |
          test "$(uname -m)" = "x86_64"
          xcodebuild -version
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.6\nBuild version 17F113')"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.5"

  test-source:
    if: ${{ inputs.operation == 'upload' }}
    needs: validate-source
    runs-on: macos-26-intel
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.sourceSHA }}
      FLUTTER_VERSION: 3.38.5
      FLUTTER_FRAMEWORK_REVISION: f6ff1529fd6d8af5f706051d9251ac9231c83407
    steps:
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.sourceSHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Fetch exact presentation contract baseline
        run: |
          git fetch --no-tags --depth=1 origin 0830294eff5b8cd86324545ed00689648c70bd23
          git cat-file -e '0830294eff5b8cd86324545ed00689648c70bd23^{commit}'
          git fetch --no-tags --depth=1 origin 521274b84c55b15027de43bf2d6c28fe85731cb5
          git cat-file -e '521274b84c55b15027de43bf2d6c28fe85731cb5^{commit}'
          git fetch --no-tags --depth=1 origin b37b073eef2be19f2534443469c4fd22e7238463
          git cat-file -e 'b37b073eef2be19f2534443469c4fd22e7238463^{commit}'
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Verify exact Flutter framework revision
        run: |
          actual_revision="$(flutter --version --machine | ruby -rjson -e 'puts JSON.parse($stdin.read).fetch("frameworkRevision")')"
          test "$actual_revision" = "$FLUTTER_FRAMEWORK_REVISION"
      - name: Generate prerequisites without source drift
        run: |
          flutter pub get --enforce-lockfile
          dart --suppress-analytics run build_runner build --delete-conflicting-outputs
          dart --suppress-analytics run slang
          git diff --exit-code -- lib pubspec.lock
      - name: Prepare digest-bound official iOS core
        env:
          CORE_ARCHIVE_SHA256: 31a03842df31fcebd8a1d43c883acd82f437639075815029f00859fb3470164b
          CORE_ARCHIVE_SIZE: "63496240"
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/hiddify-lib-ios.tar.gz" \
            https://github.com/hiddify/hiddify-core/releases/download/v4.1.0/hiddify-lib-ios.tar.gz
          scripts/prepare_ios_baseline_core.sh \
            --archive "$RUNNER_TEMP/hiddify-lib-ios.tar.gz" \
            --destination "$RUNNER_TEMP/ios-baseline-core"
          (cd "$RUNNER_TEMP/ios-baseline-core" && shasum -a 256 -c HiddifyCore.xcframework.sha256)
          test "$(wc -c < "$RUNNER_TEMP/hiddify-lib-ios.tar.gz" | tr -d ' ')" = "$CORE_ARCHIVE_SIZE"
          test "$(shasum -a 256 "$RUNNER_TEMP/hiddify-lib-ios.tar.gz" | awk '{print $1}')" = "$CORE_ARCHIVE_SHA256"
          rm -rf ios/Frameworks/HiddifyCore.xcframework
          cp -R "$RUNNER_TEMP/ios-baseline-core/HiddifyCore.xcframework" ios/Frameworks/HiddifyCore.xcframework
      - name: Run release and signed-artifact contract tests
        run: |
          bash test/ios/vpn_manager_manual_policy_test.sh
          bash test/ios/foreground_setup_mode_test.sh
          ruby test/ci/ios_source_ci_scope_test.rb
          ruby test/ci/blizzard_runtime_boundary_test.rb
          ruby test/ci/ios_baseline_identity_inventory_test.rb
          ruby test/ci/ios_baseline_signed_entitlements_test.rb
          ruby test/ci/ios_baseline_release_test.rb
          ruby test/ci/ios_baseline_workflow_test.rb
      - name: Verify safe native diagnostics
        run: bash test/security/native_diagnostics_privacy_test.sh
      - name: Run full Flutter tests
        run: flutter test

  verify-release-approval:
    if: ${{ inputs.operation == 'upload' }}
    needs: validate-source
    runs-on: macos-26-intel
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out exact release approval controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify explicit owner reference-release approval
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.sourceSHA }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.buildNumber }}
          EXPECTED_SOURCE_SHA: 2c45e4e73fae9de250787c544dae634d92b9985f
          EXPECTED_VERSION: 0.1.0
          EXPECTED_MINIMUM_BUILD_NUMBER: "28"
          EXPECTED_APPROVER: maikrais98
          EXPECTED_APPROVAL_SHA256: 9b6a36fa44f9fef0cbe65eee6f3725bf4ce6775019faece183784f560a3c5b52
        run: |
          test "$REQUESTED_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$REQUESTED_VERSION" = "$EXPECTED_VERSION"
          test "$REQUESTED_BUILD_NUMBER" -ge "$EXPECTED_MINIMUM_BUILD_NUMBER"
          python3 scripts/verify_reference_release_approval.py \
            --approval "release/reference-approvals/${EXPECTED_SOURCE_SHA}.json" \
            --expected-approval-sha256 "$EXPECTED_APPROVAL_SHA256" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-minimum-build-number "$EXPECTED_MINIMUM_BUILD_NUMBER" \
            --requested-build-number "$REQUESTED_BUILD_NUMBER" \
            --expected-approver "$EXPECTED_APPROVER"

  test-metadata:
    if: ${{ inputs.operation == 'metadata' }}
    needs: validate-source
    runs-on: macos-26-intel
    permissions:
      contents: read
    steps:
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.sourceSHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source
        env:
          SOURCE_SHA: ${{ inputs.sourceSHA }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Validate metadata encryption public key
        env:
          METADATA_PUBLIC_KEY: ${{ inputs.metadataPublicKey }}
        run: |
          ruby -ropenssl -rbase64 -e '
            begin
              key = OpenSSL::PKey.read(Base64.strict_decode64(ENV.fetch("METADATA_PUBLIC_KEY")))
              valid = key.is_a?(OpenSSL::PKey::RSA) && key.n.num_bits >= 3072 && !key.private?
            rescue ArgumentError, KeyError, OpenSSL::PKey::PKeyError
              valid = false
            end
            abort("ERROR_CODE=INVALID_METADATA_PUBLIC_KEY") unless valid
          '
      - name: Run metadata release contract tests
        run: |
          ruby test/ci/ios_baseline_identity_inventory_test.rb
          ruby test/ci/ios_baseline_signed_entitlements_test.rb
          ruby test/ci/ios_baseline_release_test.rb
          ruby test/ci/ios_baseline_workflow_test.rb

  metadata-testflight:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'metadata' }}
    needs: test-metadata
    runs-on: macos-26-intel
    environment: release-publish
    permissions:
      contents: read
    steps:
      - name: Require protected publish environment readiness
        env:
          RELEASE_ENVIRONMENT_READY: ${{ vars.RELEASE_ENVIRONMENT_READY }}
        run: test "$RELEASE_ENVIRONMENT_READY" = "true"
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.sourceSHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source
        env:
          SOURCE_SHA: ${{ inputs.sourceSHA }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Read and encrypt baseline metadata
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          BUNDLE_ID: com.womaninred.baseline
          SOURCE_SHA: ${{ inputs.sourceSHA }}
          METADATA_PUBLIC_KEY: ${{ inputs.metadataPublicKey }}
        run: |
          mkdir -p out
          ruby scripts/ios_baseline_release.rb metadata > out/ios-baseline-metadata.json
      - name: Retain encrypted baseline metadata
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-baseline-metadata-${{ inputs.sourceSHA }}-${{ inputs.buildNumber }}
          path: out/ios-baseline-metadata.json
          if-no-files-found: error
          retention-days: 7

  preflight-upload:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'upload' }}
    needs:
      - test-source
      - verify-release-approval
    runs-on: macos-26-intel
    environment: release-publish
    permissions:
      contents: read
    steps:
      - name: Require protected publish environment readiness
        env:
          RELEASE_ENVIRONMENT_READY: ${{ vars.RELEASE_ENVIRONMENT_READY }}
        run: test "$RELEASE_ENVIRONMENT_READY" = "true"
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.sourceSHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source
        env:
          SOURCE_SHA: ${{ inputs.sourceSHA }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Revalidate live app, group, version, and build collision
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          ASC_APP_ID: ${{ vars.IOS_BASELINE_ASC_APP_ID }}
          BUNDLE_ID: com.womaninred.baseline
          TESTER_GROUP_ID: ${{ secrets.IOS_BASELINE_TESTER_GROUP_ID }}
          TESTER_ID: ${{ secrets.IOS_BASELINE_SELF_TESTER_ID }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.buildNumber }}
        run: ruby scripts/ios_baseline_release.rb preflight

  sign-baseline:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'upload' }}
    needs:
      - preflight-upload
      - verify-release-approval
    runs-on: macos-26-intel
    environment: release-signing
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      FLUTTER_VERSION: 3.38.5
      SOURCE_SHA: ${{ inputs.sourceSHA }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.buildNumber }}
      BASE_BUNDLE_IDENTIFIER: com.womaninred.baseline
      SERVICE_IDENTIFIER: com.hiddify.app
      TEAM_ID: M9D72QQJ79
      CORE_ARCHIVE_SHA256: 31a03842df31fcebd8a1d43c883acd82f437639075815029f00859fb3470164b
      CORE_ARCHIVE_SIZE: "63496240"
    steps:
      - name: Require protected signing environment readiness
        env:
          RELEASE_ENVIRONMENT_READY: ${{ vars.RELEASE_ENVIRONMENT_READY }}
        run: test "$RELEASE_ENVIRONMENT_READY" = "true"
      - name: Require persistent signing setup
        env:
          IOS_BASELINE_SIGNING_P12_BASE64: ${{ secrets.IOS_BASELINE_SIGNING_P12_BASE64 }}
          IOS_BASELINE_SIGNING_P12_PASSWORD: ${{ secrets.IOS_BASELINE_SIGNING_P12_PASSWORD }}
          IOS_BASELINE_APP_PROFILE_BASE64: ${{ secrets.IOS_BASELINE_APP_PROFILE_BASE64 }}
          IOS_BASELINE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_BASELINE_EXTENSION_PROFILE_BASE64 }}
          IOS_BASELINE_SIGNING_CERT_SHA256: ${{ vars.IOS_BASELINE_SIGNING_CERT_SHA256 }}
        run: |
          ruby <<'RUBY'
          required = %w[
            IOS_BASELINE_SIGNING_P12_BASE64 IOS_BASELINE_SIGNING_P12_PASSWORD
            IOS_BASELINE_APP_PROFILE_BASE64 IOS_BASELINE_EXTENSION_PROFILE_BASE64
            IOS_BASELINE_SIGNING_CERT_SHA256
          ]
          if required.any? { |name| ENV[name].to_s.empty? }
            abort("ERROR_CODE=PERSISTENT_SIGNING_MATERIAL_MISSING")
          end
          RUBY
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.sourceSHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify checkout and pinned Apple toolchain
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(uname -m)" = "x86_64"
          xcodebuild -version
          test "$(xcodebuild -version)" = "$(printf 'Xcode 26.6\nBuild version 17F113')"
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "26.5"
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          major="${sdk%%.*}"
          test "$major" -ge 26
      - name: Check out signing controller without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: .signing-controller
          fetch-depth: 1
          persist-credentials: false
      - name: Verify signing controller
        env:
          SIGNING_CONTROLLER_SHA: ${{ github.sha }}
        run: test "$(git -C .signing-controller rev-parse HEAD)" = "$SIGNING_CONTROLLER_SHA"
      - name: Require telemetry-capable reviewed source
        run: |
          test -f lib/core/observability/better_stack_log_printer.dart || { echo "ERROR_CODE=TELEMETRY_SOURCE_MISSING"; exit 1; }
      - name: Configure free-tier beta diagnostics
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          BETTERSTACK_LOGS_URL: ${{ secrets.BETTERSTACK_LOGS_URL }}
          BETTERSTACK_SOURCE_TOKEN: ${{ secrets.BETTERSTACK_SOURCE_TOKEN }}
        run: python3 .signing-controller/scripts/prepare_telemetry.py --require-remote --output "$RUNNER_TEMP/wir-telemetry.json"
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Verify exact Flutter framework revision
        env:
          FLUTTER_FRAMEWORK_REVISION: f6ff1529fd6d8af5f706051d9251ac9231c83407
        run: |
          actual_revision="$(flutter --version --machine | ruby -rjson -e 'puts JSON.parse($stdin.read).fetch("frameworkRevision")')"
          test "$actual_revision" = "$FLUTTER_FRAMEWORK_REVISION"
      - name: Prepare digest-bound official iOS core
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/hiddify-lib-ios.tar.gz" \
            https://github.com/hiddify/hiddify-core/releases/download/v4.1.0/hiddify-lib-ios.tar.gz
          scripts/prepare_ios_baseline_core.sh \
            --archive "$RUNNER_TEMP/hiddify-lib-ios.tar.gz" \
            --destination "$RUNNER_TEMP/ios-baseline-core"
          (cd "$RUNNER_TEMP/ios-baseline-core" && shasum -a 256 -c HiddifyCore.xcframework.sha256)
          test "$(wc -c < "$RUNNER_TEMP/hiddify-lib-ios.tar.gz" | tr -d ' ')" = "$CORE_ARCHIVE_SIZE"
          test "$(shasum -a 256 "$RUNNER_TEMP/hiddify-lib-ios.tar.gz" | awk '{print $1}')" = "$CORE_ARCHIVE_SHA256"
          rm -rf ios/Frameworks/HiddifyCore.xcframework
          cp -R "$RUNNER_TEMP/ios-baseline-core/HiddifyCore.xcframework" ios/Frameworks/HiddifyCore.xcframework
          cp "$RUNNER_TEMP/ios-baseline-core/HiddifyCore.xcframework.sha256" ios/Frameworks/HiddifyCore.xcframework.sha256
      - name: Resolve Flutter and CocoaPods dependencies
        run: |
          flutter pub get --enforce-lockfile
          dart --suppress-analytics run build_runner build --delete-conflicting-outputs
          dart --suppress-analytics run slang
          git diff --exit-code -- lib pubspec.lock
          (cd ios && pod install)
      - name: Compile exact version without signing
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.buildNumber }}
        run: |
          flutter build ipa --release --no-codesign --target lib/main_prod.dart \
            --build-name "$VERSION" \
            --build-number "$BUILD_NUMBER" \
            --dart-define-from-file "$RUNNER_TEMP/wir-telemetry.json"
      - name: Capture actual unsigned native inputs
        env:
          FLUTTER_FRAMEWORK_REVISION: f6ff1529fd6d8af5f706051d9251ac9231c83407
        run: |
          cmp ios/Podfile.lock ios/Pods/Manifest.lock
          POD_VERSION="$(pod --version)" ruby -rjson -rdigest -rfileutils <<'RUBY'
          root = "out/native-inputs"
          paths = %w[ios/Podfile.lock ios/Pods/Manifest.lock ios/Runner/GeneratedPluginRegistrant.m]
          paths += Dir.glob("ios/Pods/Local Podspecs/*.json").sort
          optional = "ios/Pods/Target Support Files/Pods-Runner/Pods-Runner.release.xcconfig"
          paths << optional if File.file?(optional)
          entries = paths.map do |path|
            destination = File.join(root, path)
            FileUtils.mkdir_p(File.dirname(destination))
            FileUtils.cp(path, destination)
            {path: path, sha256: Digest::SHA256.file(destination).hexdigest}
          end
          receipt = {schema: "ios-native-inputs/v1", source_sha: ENV.fetch("SOURCE_SHA"),
                     flutter_revision: ENV.fetch("FLUTTER_FRAMEWORK_REVISION"),
                     cocoapods_version: ENV.fetch("POD_VERSION"), files: entries}
          File.write(File.join(root, "manifest.json"), JSON.pretty_generate(receipt) + "\n")
          RUBY
      - name: Archive and export without provisioning updates
        env:
          SIGNING_CONTROLLER_SHA: ${{ github.sha }}
          IOS_BASELINE_SIGNING_P12_BASE64: ${{ secrets.IOS_BASELINE_SIGNING_P12_BASE64 }}
          IOS_BASELINE_SIGNING_P12_PASSWORD: ${{ secrets.IOS_BASELINE_SIGNING_P12_PASSWORD }}
          IOS_BASELINE_APP_PROFILE_BASE64: ${{ secrets.IOS_BASELINE_APP_PROFILE_BASE64 }}
          IOS_BASELINE_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_BASELINE_EXTENSION_PROFILE_BASE64 }}
          IOS_BASELINE_SIGNING_CERT_SHA256: ${{ vars.IOS_BASELINE_SIGNING_CERT_SHA256 }}
        run: |
          ruby .signing-controller/scripts/ios_baseline_manual_signing.rb with-signing \
            --project-root "$PWD" \
            --provenance-path out/ios-baseline-signing-overrides.json \
            -- bash -e -o pipefail <<'SIGNING_COMMANDS'
          classify_signing_failure() {
            SIGNING_DIAGNOSTIC_LOG_PATH="$1" ruby 2>/dev/null <<'RUBY'
          # SIGNING_DIAGNOSTIC_CLASSIFIER_START
          max_log_bytes = 128 * 1024
          unknown = "UNCLASSIFIED"

          def signing_diagnostic(path, max_log_bytes, unknown)
            data = File.open(path, "rb") do |file|
              file.seek(-[file.size, max_log_bytes].min, IO::SEEK_END)
              file.read(max_log_bytes)
            end
            return [unknown] unless data

            data.force_encoding(Encoding::UTF_8)
            return [unknown] unless data.valid_encoding?

            patterns = [
              ["DEVELOPER_AGREEMENT_UPDATE_REQUIRED", /(?:program license agreement|developer agreement).{0,160}(?:updated?|accept|expired)|(?:updated?|accept).{0,160}(?:program license agreement|developer agreement)/i],
              ["SIGNING_CERTIFICATE_QUOTA_EXCEEDED", /maximum number of.{0,80}certificates|certificate.{0,80}(?:quota|limit).{0,80}(?:reached|exceeded)/i],
              ["SIGNING_CERTIFICATE_MISSING_OR_INVALID", /no signing certificate|no certificate.{0,80}(?:found|valid)|0 valid identities found/i],
              ["PROVISIONING_PROFILE_MISSING_OR_INVALID", /no profiles? for|requires a provisioning profile|provisioning profile.{0,120}(?:doesn't match|not found|expired|invalid)/i],
              ["CAPABILITY_OR_ENTITLEMENT_MISMATCH", /(?:capability|entitlement).{0,160}(?:not supported|doesn't support|mismatch)|doesn't support.{0,80}(?:capability|entitlement)/i],
              ["AUTHENTICATION_FAILED", /DVTPortalServiceErrorDomain\s+Code=1100\b|DVTDeveloperAccountCredentialsError\s+Code=\d+\b|unable to authenticate|authentication credentials.{0,80}(?:invalid|missing|expired)/i],
              ["KEYCHAIN_ACCESS_FAILED", /keychain.{0,120}(?:locked|access|interaction|not found)|errSec(?:AuthFailed|InteractionNotAllowed|ItemNotFound)/i],
              ["NETWORK_SERVICE_UNAVAILABLE", /NSURLErrorDomain\s+Code=-(?:1001|1003|1004|1005|1009|1011)\b|could not connect to apple/i],
              ["DISK_SPACE_EXHAUSTED", /no space left on device|disk.{0,80}(?:full|space exhausted)/i]
            ]
            tokens = patterns.each_with_object([]) do |(token, pattern), matches|
              matches << token if data.match?(pattern)
            end
            tokens.empty? ? [unknown] : tokens
          rescue StandardError
            [unknown]
          end

          signing_diagnostic(ENV.fetch("SIGNING_DIAGNOSTIC_LOG_PATH"), max_log_bytes, unknown).each do |token|
            puts "SIGNING_DIAGNOSTIC=#{token}"
          end
          # SIGNING_DIAGNOSTIC_CLASSIFIER_END
          RUBY
          }
          if ! xcodebuild \
            -workspace "$IOS_BASELINE_SIGNING_WORKSPACE" \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            BASE_BUNDLE_IDENTIFIER="$BASE_BUNDLE_IDENTIFIER" \
            SERVICE_IDENTIFIER="$SERVICE_IDENTIFIER" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive \
            > "$RUNNER_TEMP/ios-baseline-signing-archive.log" 2>&1; then
            classify_signing_failure "$RUNNER_TEMP/ios-baseline-signing-archive.log" || echo "SIGNING_DIAGNOSTIC=UNCLASSIFIED"
            echo "ERROR_CODE=SIGNING_ARCHIVE_FAILED"
            exit 1
          fi
          if ! xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$IOS_BASELINE_SIGNING_EXPORT_OPTIONS" \
            > "$RUNNER_TEMP/ios-baseline-signing-export.log" 2>&1; then
            classify_signing_failure "$RUNNER_TEMP/ios-baseline-signing-export.log" || echo "SIGNING_DIAGNOSTIC=UNCLASSIFIED"
            echo "ERROR_CODE=SIGNING_EXPORT_FAILED"
            exit 1
          fi
          SIGNING_COMMANDS
      - name: Verify signed IPA and write provenance
        run: |
          mkdir -p out
          shopt -s nullglob
          ipa=(build/ios/ipa/*.ipa)
          test "${#ipa[@]}" -eq 1
          cp "${ipa[0]}" out/ios-baseline.ipa
          ruby scripts/verify_ios_baseline_ipa.rb \
            --ipa out/ios-baseline.ipa \
            --team "$TEAM_ID" \
            --app-identifier "$BASE_BUNDLE_IDENTIFIER" \
            --extension-identifier "$BASE_BUNDLE_IDENTIFIER.HiddifyPacketTunnel" \
            --app-group "group.$BASE_BUNDLE_IDENTIFIER" \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER"
          ipa_sha256="$(shasum -a 256 out/ios-baseline.ipa | awk '{print $1}')"
          framework_manifest_sha256="$(shasum -a 256 ios/Frameworks/HiddifyCore.xcframework.sha256 | awk '{print $1}')"
          SOURCE_SHA="$SOURCE_SHA" VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" \
            BASE_BUNDLE_IDENTIFIER="$BASE_BUNDLE_IDENTIFIER" TEAM_ID="$TEAM_ID" \
            CORE_ARCHIVE_SHA256="$CORE_ARCHIVE_SHA256" CORE_ARCHIVE_SIZE="$CORE_ARCHIVE_SIZE" \
            FRAMEWORK_MANIFEST_SHA256="$framework_manifest_sha256" IPA_SHA256="$ipa_sha256" \
            ruby -rjson -rdigest -e 'puts JSON.generate({signing_overrides_sha256:Digest::SHA256.file("out/ios-baseline-signing-overrides.json").hexdigest,native_inputs_sha256:Digest::SHA256.file("out/native-inputs/manifest.json").hexdigest,schema:"ios-baseline-provenance/v1",source_sha:ENV.fetch("SOURCE_SHA"),version:ENV.fetch("VERSION"),build_number:ENV.fetch("BUILD_NUMBER"),bundle_id:ENV.fetch("BASE_BUNDLE_IDENTIFIER"),team_id:ENV.fetch("TEAM_ID"),core_archive_sha256:ENV.fetch("CORE_ARCHIVE_SHA256"),core_archive_size:ENV.fetch("CORE_ARCHIVE_SIZE"),framework_manifest_sha256:ENV.fetch("FRAMEWORK_MANIFEST_SHA256"),ipa_sha256:ENV.fetch("IPA_SHA256")})' \
            > out/provenance.json
      - name: Retain exact baseline candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ios-baseline-${{ inputs.sourceSHA }}-${{ inputs.buildNumber }}
          path: out
          if-no-files-found: error
          retention-days: 7

  upload-testflight:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'upload' }}
    needs: sign-baseline
    runs-on: macos-26-intel
    environment: release-publish
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.sourceSHA }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.buildNumber }}
      BUNDLE_ID: com.womaninred.baseline
      ASC_APP_ID: ${{ vars.IOS_BASELINE_ASC_APP_ID }}
    steps:
      - name: Require protected publish environment readiness
        env:
          RELEASE_ENVIRONMENT_READY: ${{ vars.RELEASE_ENVIRONMENT_READY }}
        run: test "$RELEASE_ENVIRONMENT_READY" = "true"
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.sourceSHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Download exact baseline candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: ios-baseline-${{ inputs.sourceSHA }}-${{ inputs.buildNumber }}
          path: out
      - name: Verify source, version, build, digest, and signed identity
        run: |
          actual_ipa_sha="$(shasum -a 256 out/ios-baseline.ipa | awk '{print $1}')"
          SOURCE_SHA="$SOURCE_SHA" VERSION="$VERSION" BUILD_NUMBER="$BUILD_NUMBER" ACTUAL_IPA_SHA="$actual_ipa_sha" \
            ruby -rjson -e 'p=JSON.parse(File.read("out/provenance.json")); expected={"source_sha"=>ENV.fetch("SOURCE_SHA"),"version"=>ENV.fetch("VERSION"),"build_number"=>ENV.fetch("BUILD_NUMBER"),"bundle_id"=>"com.womaninred.baseline","team_id"=>"M9D72QQJ79","core_archive_sha256"=>"31a03842df31fcebd8a1d43c883acd82f437639075815029f00859fb3470164b","core_archive_size"=>"63496240","ipa_sha256"=>ENV.fetch("ACTUAL_IPA_SHA")}; abort("PROVENANCE_MISMATCH") unless p["schema"]=="ios-baseline-provenance/v1" && expected.all?{|k,v| p[k]==v} && p["framework_manifest_sha256"].to_s.match?(/\A[0-9a-f]{64}\z/)'
          ruby -rjson -rdigest <<'RUBY'
          provenance = JSON.parse(File.read("out/provenance.json"))
          overrides_path = "out/ios-baseline-signing-overrides.json"
          abort("SIGNING_OVERRIDES_MISMATCH") unless Digest::SHA256.file(overrides_path).hexdigest == provenance.fetch("signing_overrides_sha256")
          root = "out/native-inputs"
          manifest = File.join(root, "manifest.json")
          abort("NATIVE_INPUTS_MISMATCH") unless Digest::SHA256.file(manifest).hexdigest == provenance.fetch("native_inputs_sha256")
          receipt = JSON.parse(File.read(manifest))
          abort("NATIVE_INPUTS_MISMATCH") unless receipt.fetch("schema") == "ios-native-inputs/v1" && receipt.fetch("source_sha") == ENV.fetch("SOURCE_SHA")
          receipt.fetch("files").each do |entry|
            path = entry.fetch("path")
            abort("NATIVE_INPUTS_MISMATCH") unless path.start_with?("ios/") && !path.split("/").include?("..")
            abort("NATIVE_INPUTS_MISMATCH") unless Digest::SHA256.file(File.join(root, path)).hexdigest == entry.fetch("sha256")
          end
          RUBY
          ruby scripts/verify_ios_baseline_ipa.rb \
            --ipa out/ios-baseline.ipa \
            --team M9D72QQJ79 \
            --app-identifier com.womaninred.baseline \
            --extension-identifier com.womaninred.baseline.HiddifyPacketTunnel \
            --app-group group.com.womaninred.baseline \
            --version "$VERSION" \
            --build-number "$BUILD_NUMBER"
      - name: Upload exact IPA once and prove TestFlight readiness
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          TESTER_GROUP_ID: ${{ secrets.IOS_BASELINE_TESTER_GROUP_ID }}
          TESTER_ID: ${{ secrets.IOS_BASELINE_SELF_TESTER_ID }}
          IPA_PATH: out/ios-baseline.ipa
        run: ruby scripts/ios_baseline_release.rb upload

  status-testflight:
    if: ${{ github.ref == 'refs/heads/main' && inputs.operation == 'status' }}
    needs: validate-source
    runs-on: macos-26-intel
    environment: release-publish
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ inputs.sourceSHA }}
      VERSION: ${{ inputs.version }}
      BUILD_NUMBER: ${{ inputs.buildNumber }}
      BUNDLE_ID: com.womaninred.baseline
      ASC_APP_ID: ${{ vars.IOS_BASELINE_ASC_APP_ID }}
    steps:
      - name: Require protected publish environment readiness
        env:
          RELEASE_ENVIRONMENT_READY: ${{ vars.RELEASE_ENVIRONMENT_READY }}
        run: test "$RELEASE_ENVIRONMENT_READY" = "true"
      - name: Check out exact reviewed source without credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.sourceSHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact checked-out source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Resume exact TestFlight build without upload
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          TESTER_GROUP_ID: ${{ secrets.IOS_BASELINE_TESTER_GROUP_ID }}
          TESTER_ID: ${{ secrets.IOS_BASELINE_SELF_TESTER_ID }}
        run: ruby scripts/ios_baseline_release.rb status
