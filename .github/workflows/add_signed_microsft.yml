name: Upload store MSIX to release

permissions: {}

on:
  release:
    types: [released]   # Run the action when a GitHub release is published

  # schedule:
  #   - cron:  '0 */6 * * *'  # Run the action every 6 hours

  workflow_dispatch:    # Manually run the action

jobs:
  upload-store-msix-to-release:
    environment: release-publish
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
    - name: Require protected publishing environment
      env:
        READY: ${{ vars.RELEASE_ENVIRONMENT_READY }}
      run: test "$READY" = true
    - name: Upload store MSIX to release
      uses: hiddify/Upload-Microsoft-Store-MSIX-Package-to-GitHub-Release@eb072e77c08d5dae54cbe1f56d41cffd368f02fa # develop
      with:
        store-id: 9pdfnl3qv2s5
        token: ${{ secrets.GITHUB_TOKEN }}
        asset-name-pattern: Hiddify-Windows-Setup-x64		# Optional
