name: Luma source checks

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - name: Generate prerequisites
        run: |
          flutter pub get --enforce-lockfile
          dart --suppress-analytics run build_runner build --delete-conflicting-outputs
          dart --suppress-analytics run slang
          git diff --exit-code -- lib pubspec.lock
      - name: Analyze application
        run: flutter analyze --no-pub
      - name: Test complete Baseline application
        if: ${{ !cancelled() }}
        run: flutter test

  native:
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify native VPN profile policy
        run: |
          bash test/ios/vpn_manager_manual_policy_test.sh
      - name: Verify Baseline release contracts
        run: |
          ruby test/ci/ios_source_ci_scope_test.rb
          ruby test/ci/ios_baseline_identity_inventory_test.rb
          ruby test/ci/ios_baseline_signed_entitlements_test.rb
          ruby test/ci/ios_baseline_release_test.rb
          ruby test/ci/ios_baseline_workflow_test.rb
